<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Site Data - Imagine PPTP Prints</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f8fafc;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: 500;
        }
        .success { background: #d1fae5; color: #047857; border: 1px solid #059669; }
        .info { background: #dbeafe; color: #1e40af; border: 1px solid #3b82f6; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #00b4d8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin: 10px 5px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #0099c2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear Site Data</h1>
        <p>This page will automatically clear all cached data for your website.</p>
        
        <div id="status"></div>
        
        <div class="info">
            <h3>What's being cleared:</h3>
            <ul>
                <li>✅ Service Worker Cache</li>
                <li>✅ Browser Cache</li>
                <li>✅ localStorage</li>
                <li>✅ sessionStorage</li>
                <li>✅ IndexedDB</li>
                <li>✅ Cookies</li>
            </ul>
        </div>
        
        <button class="btn" onclick="clearSiteData()">🧹 Clear Site Data Now</button>
        <a href="/" class="btn">🏠 Go to Homepage</a>
    </div>

    <script>
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function clearSiteData() {
            updateStatus('🧹 Starting site data cleanup...', 'info');
            
            try {
                // Clear Service Worker
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for(let registration of registrations) {
                        await registration.unregister();
                    }
                    updateStatus('✅ Service Worker unregistered', 'success');
                }

                // Clear Caches
                const cacheNames = await caches.keys();
                await Promise.all(
                    cacheNames.map(cacheName => {
                        console.log('🗑️ Deleting cache:', cacheName);
                        return caches.delete(cacheName);
                    })
                );
                updateStatus('✅ All caches cleared', 'success');

                // Clear Storage
                localStorage.clear();
                sessionStorage.clear();
                updateStatus('✅ Storage cleared', 'success');

                // Clear Cookies
                document.cookie.split(";").forEach(function(c) { 
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
                });
                updateStatus('✅ Cookies cleared', 'success');

                // Clear IndexedDB
                if ('indexedDB' in window) {
                    const databases = await indexedDB.databases();
                    await Promise.all(
                        databases.map(db => indexedDB.deleteDatabase(db.name))
                    );
                    updateStatus('✅ IndexedDB cleared', 'success');
                }

                updateStatus('🎉 Site data cleanup complete! Please refresh your browser (Ctrl+F5)', 'success');
                
            } catch (error) {
                updateStatus('❌ Error clearing site data: ' + error.message, 'error');
            }
        }

        // Auto-clear on page load
        window.addEventListener('load', function() {
            setTimeout(clearSiteData, 1000);
        });
    </script>
</body>
</html>
