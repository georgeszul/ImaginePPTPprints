[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/es/*"
  to = "/es/404/"
  status = 404

# Security headers on every response. Netlify already redirects http:// to https://;
# HSTS tells browsers to use HTTPS from the start next time.
# The page's own Content-Security-Policy (script/style hashes) is a <meta> tag written by Astro;
# this header adds the parts a meta tag cannot carry, such as frame-ancestors.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Hashed build assets never change, so browsers can keep them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
